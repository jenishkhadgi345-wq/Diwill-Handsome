<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mind Lab | Intelligence Test</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #07090d;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            max-width: 900px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
        }

        .logo {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .logo span {
            font-size: 25px;
        }

        .timer {
            background: #10151c;
            border: 1px solid #29333f;
            padding: 10px 18px;
            border-radius: 8px;
            color: #00d9ff;
            font-weight: bold;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
        }

        .top-text {
            text-align: center;
            margin-bottom: 30px;
        }

        .top-text p {
            color: #00d9ff;
            font-size: 11px;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .top-text h1 {
            font-size: 32px;
        }

        .top-text h1 span {
            color: #00d9ff;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            color: #718092;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .progress-info strong {
            color: white;
        }

        .progress {
            height: 6px;
            background: #171d25;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 25px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #00d9ff;
            transition: 0.3s;
        }

        .question-card {
            background: #0d1118;
            border: 1px solid #252e39;
            border-radius: 16px;
            padding: 35px;
        }

        .category {
            display: inline-block;
            color: #00d9ff;
            background: #08151a;
            border: 1px solid #17343c;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 10px;
            letter-spacing: 1px;
            margin-bottom: 25px;
        }

        #question {
            font-size: 23px;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .choose {
            color: #687585;
            font-size: 10px;
            letter-spacing: 1px;
            margin-bottom: 25px;
        }

        .answers {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .answer-button {
            width: 100%;
            min-height: 58px;
            padding: 12px 16px;

            display: flex;
            align-items: center;
            gap: 15px;

            background: #090d12;
            color: white;

            border: 1px solid #29333f;
            border-radius: 10px;

            cursor: pointer;
            text-align: left;

            font-size: 15px;

            transition: 0.2s;
        }

        .answer-button:hover {
            border-color: #00d9ff;
            background: #0c141a;
        }

        .answer-letter {
            width: 32px;
            height: 32px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 7px;

            background: #151b23;
            color: #8c98a6;

            font-weight: bold;
            flex-shrink: 0;
        }

        .answer-button.correct {
            border-color: #00e5a0;
            background: #071b16;
        }

        .answer-button.correct .answer-letter {
            background: #00e5a0;
            color: #031015;
        }

        .answer-button.wrong {
            border-color: #ff526b;
            background: #1d0b10;
        }

        .answer-button.wrong .answer-letter {
            background: #ff526b;
            color: white;
        }

        .answer-button:disabled {
            cursor: default;
        }

        .bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
        }

        .message {
            color: #687585;
            font-size: 12px;
        }

        .next-button {
            border: none;
            background: #00d9ff;
            color: #031015;

            padding: 14px 22px;

            border-radius: 8px;

            font-weight: bold;
            cursor: pointer;
        }

        .next-button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        @media (max-width: 600px) {

            body {
                padding: 12px;
            }

            .header {
                padding: 10px 0;
            }

            .container {
                margin: 25px auto;
            }

            .top-text h1 {
                font-size: 26px;
            }

            .question-card {
                padding: 22px 17px;
            }

            #question {
                font-size: 19px;
            }

            .answer-button {
                font-size: 14px;
            }

            .bottom {
                flex-direction: column;
                gap: 18px;
                align-items: stretch;
            }

            .next-button {
                width: 100%;
            }

            .message {
                text-align: center;
            }
        }

    </style>

</head>


<body>


    <header class="header">

        <div class="logo">
            🧠 MIND LAB
        </div>

        <div class="timer">
            ⏱️ <span id="timer">10:00</span>
        </div>

    </header>


    <main class="container">


        <div class="top-text">

            <p>
                INTELLIGENCE ANALYSIS
            </p>

            <h1>
                Good luck, <span>Diwill.</span>
            </h1>

        </div>


        <div class="progress-info">

            <span>
                QUESTION
                <strong id="questionNumber">1</strong>
                OF 15
            </span>

            <span>
                SCORE:
                <strong id="score">0</strong>
            </span>

        </div>


        <div class="progress">

            <div
                id="progressBar"
                class="progress-bar">
            </div>

        </div>


        <section class="question-card">


            <div
                id="category"
                class="category">
                LOGIC
            </div>


            <h2 id="question">
                Loading question...
            </h2>


            <p class="choose">
                SELECT THE ANSWER YOU THINK IS CORRECT
            </p>


            <!-- ANSWERS WILL APPEAR HERE -->

            <div
                id="answers"
                class="answers">
            </div>


            <div class="bottom">

                <div
                    id="message"
                    class="message">

                    🧠 Choose an answer.

                </div>


                <button
                    id="nextButton"
                    class="next-button"
                    disabled>

                    NEXT QUESTION →

                </button>

            </div>


        </section>


    </main>


    <script>


        // =====================================
        // QUESTIONS
        // =====================================

        const questions = [

            {
                category: "NUMBER LOGIC",
                question: "What number comes next? 2, 4, 8, 16, ?",
                answers: ["20", "24", "32", "36"],
                correct: 2
            },

            {
                category: "PATTERN",
                question: "What number should replace the question mark? 3, 6, 11, 18, 27, ?",
                answers: ["36", "38", "40", "42"],
                correct: 1
            },

            {
                category: "LOGIC",
                question: "All cats are animals. Some animals are black. Which statement must be true?",
                answers: [
                    "All cats are black",
                    "Some cats are black",
                    "Cats are animals",
                    "No cats are black"
                ],
                correct: 2
            },

            {
                category: "MATHEMATICS",
                question: "If 5 machines make 5 items in 5 minutes, how long would 100 machines take to make 100 items?",
                answers: [
                    "5 minutes",
                    "20 minutes",
                    "100 minutes",
                    "500 minutes"
                ],
                correct: 0
            },

            {
                category: "SEQUENCE",
                question: "Find the missing number: 1, 1, 2, 3, 5, 8, ?",
                answers: [
                    "11",
                    "12",
                    "13",
                    "15"
                ],
                correct: 2
            },

            {
                category: "WORD LOGIC",
                question: "Which word does NOT belong?",
                answers: [
                    "Apple",
                    "Banana",
                    "Carrot",
                    "Mango"
                ],
                correct: 2
            },

            {
                category: "MATHEMATICS",
                question: "A clock shows 3:00. What is the angle between the hour and minute hands?",
                answers: [
                    "45°",
                    "60°",
                    "90°",
                    "180°"
                ],
                correct: 2
            },

            {
                category: "PATTERN",
                question: "If each letter is moved one position forward in the alphabet, what does GREEN become?",
                answers: [
                    "HSFFO",
                    "HSFFM",
                    "HSGFO",
                    "GSFFO"
                ],
                correct: 0
            },

            {
                category: "LOGIC",
                question: "A farmer has 17 sheep. All but 9 run away. How many sheep remain?",
                answers: [
                    "8",
                    "9",
                    "17",
                    "0"
                ],
                correct: 1
            },

            {
                category: "NUMBER LOGIC",
                question: "What is the next number? 100, 50, 25, 12.5, ?",
                answers: [
                    "10",
                    "8.25",
                    "6.25",
                    "5"
                ],
                correct: 2
            },

            {
                category: "ANALOGY",
                question: "Book is to Reading as Fork is to...",
                answers: [
                    "Cooking",
                    "Eating",
                    "Writing",
                    "Drawing"
                ],
                correct: 1
            },

            {
                category: "LOGIC",
                question: "If yesterday was Monday, what day will it be the day after tomorrow?",
                answers: [
                    "Tuesday",
                    "Wednesday",
                    "Thursday",
                    "Friday"
                ],
                correct: 2
            },

            {
                category: "MATHEMATICS",
                question: "What is 15% of 200?",
                answers: [
                    "15",
                    "20",
                    "30",
                    "35"
                ],
                correct: 2
            },

            {
                category: "PATTERN",
                question: "Which number is missing? 4, 9, 16, 25, ?",
                answers: [
                    "30",
                    "32",
                    "36",
                    "49"
                ],
                correct: 2
            },

            {
                category: "FINAL CHALLENGE",
                question: "A bat and ball cost $1.10 together. The bat costs $1 more than the ball. How much does the ball cost?",
                answers: [
                    "$0.05",
                    "$0.10",
                    "$0.15",
                    "$0.20"
                ],
                correct: 0
            }

        ];


        // =====================================
        // VARIABLES
        // =====================================

        let currentQuestion = 0;

        let score = 0;

        let answered = false;

        let timeLeft = 600;


        // =====================================
        // ELEMENTS
        // =====================================

        const question =
            document.getElementById("question");

        const category =
            document.getElementById("category");

        const answers =
            document.getElementById("answers");

        const questionNumber =
            document.getElementById("questionNumber");

        const scoreElement =
            document.getElementById("score");

        const progressBar =
            document.getElementById("progressBar");

        const nextButton =
            document.getElementById("nextButton");

        const message =
            document.getElementById("message");

        const timer =
            document.getElementById("timer");


        // =====================================
        // LOAD QUESTION
        // =====================================

        function loadQuestion() {

            answered = false;

            nextButton.disabled = true;

            nextButton.textContent =
                "NEXT QUESTION →";

            message.textContent =
                "🧠 Choose an answer.";


            const data =
                questions[currentQuestion];


            question.textContent =
                data.question;


            category.textContent =
                data.category;


            questionNumber.textContent =
                currentQuestion + 1;


            scoreElement.textContent =
                score;


            const progress =
                ((currentQuestion + 1)
                / questions.length) * 100;


            progressBar.style.width =
                progress + "%";


            // IMPORTANT:
            // Clear old answers

            answers.innerHTML = "";


            // Create answer buttons

            data.answers.forEach(
                function(answer, index) {

                    const button =
                        document.createElement("button");


                    button.className =
                        "answer-button";


                    button.type =
                        "button";


                    button.innerHTML = `

                        <span class="answer-letter">
                            ${String.fromCharCode(65 + index)}
                        </span>

                        <span>
                            ${answer}
                        </span>

                    `;


                    button.onclick =
                        function() {

                            selectAnswer(
                                index,
                                button
                            );

                        };


                    answers.appendChild(button);

                }
            );

        }


        // =====================================
        // SELECT ANSWER
        // =====================================

        function selectAnswer(
            selected,
            selectedButton
        ) {

            if (answered) {
                return;
            }


            answered = true;


            const data =
                questions[currentQuestion];


            const buttons =
                document.querySelectorAll(
                    ".answer-button"
                );


            // Disable all buttons

            buttons.forEach(
                function(button) {

                    button.disabled = true;

                }
            );


            // Correct answer

            if (
                selected ===
                data.correct
            ) {

                selectedButton.classList.add(
                    "correct"
                );

                score++;

                scoreElement.textContent =
                    score;

                message.textContent =
                    "✓ Correct! Nice work.";

            }


            // Wrong answer

            else {

                selectedButton.classList.add(
                    "wrong"
                );

                buttons[
                    data.correct
                ].classList.add(
                    "correct"
                );

                message.textContent =
                    "✗ Not quite. The correct answer is highlighted.";

            }


            nextButton.disabled = false;


            // Last question

            if (
                currentQuestion ===
                questions.length - 1
            ) {

                nextButton.textContent =
                    "SEE RESULTS →";

            }

        }


        // =====================================
        // NEXT QUESTION
        // =====================================

        nextButton.onclick =
            function() {

                if (!answered) {
                    return;
                }


                currentQuestion++;


                if (
                    currentQuestion >=
                    questions.length
                ) {

                    finishTest();

                    return;

                }


                loadQuestion();

            };


        // =====================================
        // FINISH TEST
        // =====================================

        function finishTest() {

            localStorage.setItem(
                "diwillScore",
                score
            );

            localStorage.setItem(
                "diwillCorrect",
                score
            );


            window.location.href =
                "result.html";

        }


        // =====================================
        // TIMER
        // =====================================

        function updateTimer() {

            const minutes =
                Math.floor(
                    timeLeft / 60
                );


            const seconds =
                timeLeft % 60;


            timer.textContent =
                String(minutes).padStart(2, "0")
                + ":"
                + String(seconds).padStart(2, "0");


            if (timeLeft <= 0) {

                finishTest();

                return;

            }


            timeLeft--;

        }


        // Start timer

        setInterval(
            updateTimer,
            1000
        );


        // Load first question

        loadQuestion();

        updateTimer();


    </script>


</body>

</html>
