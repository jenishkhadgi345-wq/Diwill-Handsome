<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Diwill Mind Lab - Result</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0b0b0f;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .result-box {
            width: 90%;
            max-width: 600px;
            padding: 45px 30px;
            background: #15151c;
            border: 1px solid #292936;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.08);
        }

        .small-title {
            font-size: 14px;
            letter-spacing: 4px;
            color: #999;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .message {
            color: #aaa;
            margin-bottom: 30px;
            font-size: 17px;
        }

        .score {
            font-size: 65px;
            font-weight: bold;
            margin: 20px 0;
        }

        .details {
            display: flex;
            justify-content: center;
            gap: 35px;
            margin: 25px 0;
            color: #ccc;
        }

        .detail h3 {
            font-size: 14px;
            color: #888;
            margin-bottom: 8px;
        }

        .detail p {
            font-size: 24px;
            font-weight: bold;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 30px;
            background: white;
            color: black;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.3s;
        }

        .button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 255, 255, 0.15);
        }

        @media (max-width: 500px) {
            h1 {
                font-size: 32px;
            }

            .score {
                font-size: 50px;
            }

            .details {
                gap: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="result-box">

        <div class="small-title">DIWILL MIND LAB</div>

        <h1>Test Complete!</h1>

        <p class="message">
            Let's see how your brain performed...
        </p>

        <div class="score" id="score">
            0 / 15
        </div>

        <div class="details">

            <div class="detail">
                <h3>CORRECT</h3>
                <p id="correct">0</p>
            </div>

            <div class="detail">
                <h3>WRONG</h3>
                <p id="wrong">0</p>
            </div>

            <div class="detail">
                <h3>ACCURACY</h3>
                <p id="percentage">0%</p>
            </div>

        </div>

        <a href="index.html" class="button">
            Back to Start
        </a>

    </div>

    <script>
        const score = Number(localStorage.getItem("diwillScore")) || 0;
        const total = 15;
        const wrong = total - score;
        const percentage = Math.round((score / total) * 100);

        document.getElementById("score").textContent =
            score + " / " + total;

        document.getElementById("correct").textContent =
            score;

        document.getElementById("wrong").textContent =
            wrong;

        document.getElementById("percentage").textContent =
            percentage + "%";
    </script>

</body>
</html>
